title: PrivateUnsecuredLoanDisbursed
description: |
  An event indicating that a private unsecured loan has been
  disbursed
type: object
additionalProperties: false
'$id': 'https://open-broker.org/schema/v0/no/PrivateUnsecuredLoanDisbursed'
'$schema': 'http://json-schema.org/draft-06/schema#'
required:
  - brokerReference
  - amountDisbursed
  - amountBrokered
properties:
  brokerReference:
    title: A reference-id used by the broker
    $ref: 'https://open-broker.org/schema/v0/no/reference'
  offerId:
    title: A reference used for identifying the offer that has been disbursed
    description: |
      The id of the offer, also when the event is for a loan part (see
      `type`). The loan is identified by `type`, not by `offerId`.
    $ref: 'https://open-broker.org/schema/v0/no/reference'
  amountDisbursed:
    type: integer
    minimum: 0
    title: Amount disbursed
    description: |
      The total amount disbursed to
      the customer of the loan being brokered. When an offer has loan
      parts that are loans of their own, each loan has its own event
      with its own amounts (see `type`).
  amountBrokered:
    type: integer
    minimum: 0
    title: Amount considered brokered by the lender
    description: |
      The amount the lender considers the broker to have
      brokered. For example, the amount disbursed exclusive
      of loans refinanced within the lender.
  type:
    '$ref': '#/definitions/loanPartType'
definitions:
  loanPartType:
    type: string
    title: Type of the loan part the event is for
    description: |
      Sent when the event is for a loan part of the offer that is a loan
      of its own (see `loanPart.type` in PrivateUnsecuredLoanOffering).
      Not sent for the offer's own loan. A `TOP_UP` part is inside the
      offer's own loan and has no events of its own.
      The events of the loans of one offer can come in any order. An
      event without `type` does not mean that every loan is disbursed.
      The broker should expect one Disbursed for the offer's own loan
      and one for each `COMBO` or `COMBO_TOP_UP` part of the accepted
      offer.
    'meta:enum':
      COMBO: The `COMBO` loan part was disbursed. The amounts are for that loan alone.
      COMBO_TOP_UP: The `COMBO_TOP_UP` loan part was disbursed. The amounts are for that loan alone.
    enum:
      - COMBO
      - COMBO_TOP_UP
