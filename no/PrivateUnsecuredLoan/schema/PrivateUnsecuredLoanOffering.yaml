title: PrivateUnsecuredLoanOffering
description: An offer for a loan
type: object
additionalProperties: false
'$id': 'https://open-broker.org/schema/v0/no/PrivateUnsecuredLoanOffering'
'$schema': 'http://json-schema.org/draft-06/schema#'
definitions:
  loanInsuranceOffer:
    type: object
    additionalProperties: false
    required:
      - insuredAmount
      - monthlyPremium
    properties:
      insuredAmount:
        type: integer
        minimum: 1
        title: The amount insured
      monthlyPremium:
        type: integer
        minimum: 1
        title: The monthly premium to be paid
      descriptiveText:
        type: string
        title: A text to be displayed along with the offer.
  offer:
    type: object
    additionalProperties: false
    required:
      - effectiveInterestRate
      - nominalInterestRate
      - minOfferedCredit
      - offeredCredit
      - maxOfferedCredit
      - mustRefinance
      - arrangementFee
      - termFee
      - invoiceFee
      - termMonths
      - amortizationType
    properties:
      effectiveInterestRate:
        type: string
        pattern: '^[0-9]+(\.[0-9]+)?$'
        title: Effective interest rate (APR)
        description: |
          The effective annual interest rate of the loan
          formatted as a string to avoid problems
          floating-point numbers. An effective interest rate
          of 15% would be written as `0.15`, and 100% is
          equal to `1.0`.
      nominalInterestRate:
        type: string
        pattern: '^[0-9]+(\.[0-9]+)?$'
        title: Nominal interest rate
        description: |
          The nominal annual interest rate of the loan
          formatted as a string to avoid problems
          floating-point numbers. An nominal interest rate
          of 15% would be written as `0.15`, and 100% is
          equal to `1.0`.
      minOfferedCredit:
        title: Minimum offered credit
        description: |
          The minimum amount for which the lender is
          willing to offer this interest rate for.
          This value can be equal to both the maxOfferedCredit and
          offeredCredit. Indicating that this is the only possible
          amount offered.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      offeredCredit:
        type: integer
        minimum: 1
        title: Offered credit
        description: |
          The amount the customer applied for or the highest number
          the customer is approved for, if this number is lower than
          what was originally applied for.
          This value can be equal to both the minOfferedCredit and
          maxOfferedCredit. Indicating that this is the only possible
          amount offered.
      minimumMonthlyCost:
        title: Minimum monthly cost
        description: |
          The minimum amount the customer must pay on the credit each month.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      monthlyCost:
        title: Average monthly cost
        description: |
          The average monthly cost of the loan given `offeredCredit`,
          `termMonths` and `effectiveInterestRate`.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      maxOfferedCredit:
        title: Maximum offered credit
        description: |
          The largest loan that this customer is approved for under
          the current interest rate.
          This value can be equal to both the minOfferedCredit and
          offeredCredit. Indicating that this is the only possible
          amount offered.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      mustRefinance:
        title: Amount that must be refinanced
        description: |
          Amount the customer must use to refinance other loans.
          Use zero to indicate that no refinancing is required.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 0
      totalRepaymentAmount:
        title: Total repayment amount
        description: |
          Total amount that should be paid to lender over the length of the loan.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      arrangementFee:
        type: integer
        minimum: 0
        title: Arrangement fee for the customer
        description: |
          An arrangement fee is a one-time fee taken by the customer
          charged by the lender for setting up the loan. Use 0 to indicate
          that no arrangement fee is charged.
      termFee:
        type: integer
        minimum: 0
        title: Fixed fee charged per term
        description: |
          Fixed fees to be paid along with amortisation and interest
          every month. This fee must be included in the calculation of
          effective interest. This field should be used for
          unavoidable fees that the customer cannot reduce by
          choosing other billing arrangements.
          0 indicates that there is no per-term fee.
      invoiceFee:
        type: integer
        minimum: 0
        title: Fee charged for particular invoicing solutions
        description: |
          A fee that the customer can avoid by choosing a different
          payment solutions such as automated transfers or electronic
          invoices. This value should not be included in the
          calculation of the APR.
      termMonths:
        title: Number of monthly terms
        description: |
          The number of month-terms required to payback the loan at
          the offered interest and offered amount.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      amortizationType:
        title: Type of amortization plan
        description: Decides in which manner the loan is amortized
        oneOf:
          - type: 'null'
          - type: string
            'meta:enum':
              ANNUITY: |
                The monthly sum that is payed by the customer is fixed, and the amount that is amortized is gradually increased
                since the the amount to cover the interest rate each month decreases which each amortization.
              STRAIGHT_LINE: |
                The amount paid for amortization each month is fixed, while the interest payment will be lower over time, meaning
                that the total monthly cost for the loan will decrease over time.
            enum:
              - ANNUITY
              - STRAIGHT_LINE
      customerUrl:
        title: Signing URL
        description: URL for signing the contract
        anyOf:
          - type: 'null'
          - type: string
            format: uri
      creditorProduct:
        type: string
        title: Type of credit product offered
        description: |
          The kind of credit product the offer represents.
          Defaults to `UNSECURED_LOAN` when omitted. Must not be null.
        default: UNSECURED_LOAN
        'meta:enum':
          UNSECURED_LOAN: |
            An unsecured personal loan paid out as a lump sum and amortized over a fixed term.
          CREDIT_CARD: |
            A revolving credit account accessed through a credit card.
          CREDIT_LINE: |
            A revolving line of credit the customer can draw from up to a credit limit.
          MORTGAGE_LOAN: |
            A loan used to buy real estate, where the property acts as security (collateral) for the lender.
        enum:
          - UNSECURED_LOAN
          - CREDIT_CARD
          - CREDIT_LINE
          - MORTGAGE_LOAN
      condition:
        title: Offer condition
        description: |
          An optional condition attached to the offer. The offer can be
          accepted while the condition is still open, but the condition must
          be fulfilled before the offer can be disbursed. Use null or omit
          when the offer has no condition.
        oneOf:
          - type: 'null'
          - type: string
            'meta:enum':
              CO_APPLICANT_NEEDED: |
                A co-applicant must be added to the application before the
                offer can be disbursed.
            enum:
              - CO_APPLICANT_NEEDED
      offerReference:
        type: string
        minLength: 1
        title: Unique reference of the offer
        description: |
          A reference that is unique per offer. It is created once, when the
          offer is first sent with status `NEW`, and stays the same in all
          `REVISED` versions of the offer. The broker sends it back in
          `PrivateUnsecuredLoanOfferAccepted` to tell which offer was accepted.
      type:
        type: string
        title: Type of the offer
        description: |
          The kind of offer. Defaults to `STANDARD` when omitted. Must not be null.
        default: STANDARD
        'meta:enum':
          STANDARD: |
            An offer based on the amount the customer applied for.
          TOP_UP: |
            An increase of a loan the customer already has at this creditor.
          DUAL: |
            An alternative refinance offer, based on the debt in the debt register
            instead of the amount applied for. The creditor sends it when the
            register shows more loans than the customer stated in the application.
          COMBO: |
            An offer that consists of a refinance loan and a cash loan, given as
            two separate loans. The extra loans are listed in `comboLoans`.
        enum:
          - STANDARD
          - TOP_UP
          - DUAL
          - COMBO
      status:
        type: string
        title: Status of the offer
        description: |
          Tells if this is the first or a later version of the offer.
          Defaults to `NEW` when omitted. Must not be null.
        default: NEW
        'meta:enum':
          NEW: |
            First version of the offer.
          REVISED: |
            A later version of the offer, for example when the conditions
            changed after the offer was accepted.
        enum:
          - NEW
          - REVISED
      purpose:
        title: Purpose of the loan
        description: What the loan money is used for.
        oneOf:
          - type: 'null'
          - '$ref': '#/definitions/purpose'
      issuedAt:
        title: Time the offer was issued
        oneOf:
          - type: 'null'
          - type: string
            format: date-time
      validUntil:
        title: Time the offer expires
        description: The offer can not be accepted after this time.
        oneOf:
          - type: 'null'
          - type: string
            format: date-time
      existingLoanAtCreditor:
        title: Existing loan at the creditor
        description: |
          The amount the customer already owes on a loan at this creditor,
          for example the loan that a `TOP_UP` offer increases.
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 0
      comboLoans:
        type: array
        title: Other loans in a combo offer
        description: |
          Used when `type` is `COMBO`. Each item is a separate loan, with its own
          terms, that comes with this offer. The customer accepts only this offer,
          and the loans in `comboLoans` go along with it.
        default: []
        items:
          '$ref': '#/definitions/comboLoan'
  purpose:
    type: string
    'meta:enum':
      REFINANCE: |
        The loan pays off the customer's existing loans.
      CASH: |
        The loan is paid out to the customer as cash.
    enum:
      - REFINANCE
      - CASH
  comboLoan:
    type: object
    additionalProperties: false
    description: |
      One loan in a combo offer. Field meanings are the same as in `offer`.
    required:
      - effectiveInterestRate
      - nominalInterestRate
      - offeredCredit
      - mustRefinance
      - arrangementFee
      - termFee
      - invoiceFee
      - termMonths
      - amortizationType
    properties:
      caseReference:
        type: string
        minLength: 1
        title: Creditor's reference for this loan
        description: The case or application id the creditor uses for this loan.
      purpose:
        title: Purpose of the loan
        oneOf:
          - type: 'null'
          - '$ref': '#/definitions/purpose'
      effectiveInterestRate:
        type: string
        pattern: '^[0-9]+(\.[0-9]+)?$'
        title: Effective interest rate (APR)
      nominalInterestRate:
        type: string
        pattern: '^[0-9]+(\.[0-9]+)?$'
        title: Nominal interest rate
      offeredCredit:
        type: integer
        minimum: 1
        title: Offered credit
      monthlyCost:
        title: Average monthly cost
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      mustRefinance:
        title: Amount that must be refinanced
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 0
      totalRepaymentAmount:
        title: Total repayment amount
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      arrangementFee:
        type: integer
        minimum: 0
        title: Arrangement fee for the customer
      termFee:
        type: integer
        minimum: 0
        title: Fixed fee charged per term
      invoiceFee:
        type: integer
        minimum: 0
        title: Fee charged for particular invoicing solutions
      termMonths:
        title: Number of monthly terms
        oneOf:
          - type: 'null'
          - type: integer
            minimum: 1
      amortizationType:
        title: Type of amortization plan
        oneOf:
          - type: 'null'
          - type: string
            enum:
              - ANNUITY
              - STRAIGHT_LINE
required:
  - brokerReference
  - offer
properties:
  brokerReference:
    title: The reference used by the broker for the application resulting in this offer
    '$ref': 'https://open-broker.org/schema/v0/no/reference'
  offerId:
    title: A reference used for identifying this particular offer
    oneOf:
      - type: 'null'
      - '$ref': 'https://open-broker.org/schema/v0/no/reference'
  offer:
    '$ref': '#/definitions/offer'
  loanInsuranceOffer:
    oneOf:
      - type: 'null'
      - '$ref': '#/definitions/loanInsuranceOffer'
  supplementaryOffers:
    type: array
    title: Other offers the customer can choose instead
    description: |
      Other offers on the same application, for example a `DUAL` offer.
      The customer can accept only one offer: `offer` or one of these.
      The accepted offer is identified by its `offerReference`.
    default: []
    items:
      '$ref': '#/definitions/offer'
